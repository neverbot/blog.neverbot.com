# general build configuration
[build]
  base = "web/"
  publish = "public"
  command = "npm run build:pro"

# Dependabot opens pull requests, and Netlify builds a deploy preview for each
# one. Those previews are not looked at, so they are skipped: the ignore command
# cancels the build when it exits 0 and lets it run when it exits 1.
[context.deploy-preview]
  ignore = 'case "$HEAD" in dependabot/*) exit 0;; esac; exit 1'

# redirect from www.blog.neverbot.com
[[redirects]]
  from = "https://www.blog.neverbot.com/*"
  to = "https://blog.neverbot.com/:splat"
  status = 301
  force = true

# redirect from old permalinks with categories and subcategories
[[redirects]]
  from = "/archivo/:category/:subcategory/:title"
  to = "/:title"
  status = 301
  force = true

[[redirects]]
  from = "/archivo/:category/:title"
  to = "/:title"
  status = 301
  force = true
